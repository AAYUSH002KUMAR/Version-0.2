<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;

            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }
        .calculator {
            width: 340px;
            background: #1f2937;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .4);
        }
        h2 {
            color: white;
            text-align: center;
            margin-bottom: 15px;
        }
        #screen {
            width: 100%;
            height: 60px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: #111827;
            color: #00ff99;
            font-size: 28px;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
        }
        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 22px;
            cursor: pointer;
            transition: .2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .number {
            background: #374151;
            color: white;
        }
        .operator {
            background: #2563eb;
            color: white;
        }
        .equal {
            background: #16a34a;
            color: white;
        }
        .clear {
            background: #dc2626;
            color: white;
        }
        .back {
            background: #9333ea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>My Calculator</h2>
        <label for="screen" class="visually-hidden">Calculator Screen</label>
        <input type="text" id="screen" readonly>
        <div class="keys">
            <button class="clear" onclick="clearScreen()">C</button>
            <button class="back" onclick="backspace()">⌫</button>
            <button class="operator" onclick="press('%')">%</button>
            <button class="operator" onclick="press('/')">÷</button>
            <button class="number" onclick="press('7')">7</button>
            <button class="number" onclick="press('8')">8</button>
            <button class="number" onclick="press('9')">9</button>
            <button class="operator" onclick="press('*')">×</button>
            <button class="number" onclick="press('4')">4</button>
            <button class="number" onclick="press('5')">5</button>
            <button class="number" onclick="press('6')">6</button>
            <button class="operator" onclick="press('-')">−</button>
            <button class="number" onclick="press('1')">1</button>
            <button class="number" onclick="press('2')">2</button>
            <button class="number" onclick="press('3')">3</button>
            <button class="operator" onclick="press('+')">+</button>
            <button class="number" onclick="press('0')">0</button>
            <button class="number" onclick="press('.')">.</button>
            <button class="equal" style="grid-column:span 2;" onclick="calculate()">=</button>
        </div>
    </div>
    <script>
        const screen = document.getElementById("screen");
        let expression = "";
        function press(value) {
            expression += value;
            screen.value = expression;
        }
        function clearScreen() {
            expression = "";
            screen.value = "";
        }
        function backspace() {
            expression = expression.slice(0, -1);
            screen.value = expression;
        }
        function calculate() {
            if (expression === "") return;
            try {
                if (expression.includes("/0")) {
                    throw "Divide by zero";
                }
                expression = eval(expression).toString();
                screen.value = expression;
            }
            catch {
                screen.value = "Error";
                expression = "";
            }
        }
        // Keyboard Support
        document.addEventListener("keydown", function (event) {
            const key = event.key;
            if ("0123456789+-*/.%".includes(key)) {
                press(key);
            }
            else if (key === "Enter") {
                calculate();
            }
            else if (key === "Backspace") {
                backspace();
            }
            else if (key === "Escape") {
                clearScreen();
            }
        });
    </script>
</body>
</html>
