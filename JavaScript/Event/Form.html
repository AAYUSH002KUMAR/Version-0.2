<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form validation</title>
</head>
<body>
    <form action="" id="form">
        <input type="text" id="username" placeholder="Enter Your Name">
        <input type="email" id="email" placeholder="Enter Email">
        <input type="text" id="phoneNumber" placeholder="Enter Phone Number">
        <input type="text" id="password" placeholder="Enter Password">
        <input type="text" id="confirmPassword" placeholder="Confirm Password">
        <input type="text" id="gender" placeholder="Enter Gender">
        <input type="text" id="checkbox" placeholder="Select Subject">
        <input type="text" id="address" placeholder="Enter Address">
        <input type="text" id="country" placeholder="Select Country">
        <input type="text" id="dob" placeholder="Enter DOB">
        <button type="submit">Submit</button>
    </form>

    <script scr="Form.js"></script>
</body>
</html>
