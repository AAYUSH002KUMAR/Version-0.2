<!-- 2.	What input type will you use to upload a image ?-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2</title>
</head>
<body>
    <h1>Input type to upload an image:</h1>
    <label for="imageUpload">Upload an image:</label>
    <input type="file" id="imageUpload" accept="image/*">
</body>
</html>
