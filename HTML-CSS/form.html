<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>

<body>

    <form action="table.html" method="get">

        <label>Name</label>
        <input type="text" name="name" placeholder="Name">
        <br><br>

        <label>Email-id</label>
        <input type="email" name="email" placeholder="Email-id">
        <br><br>

        <label>Password</label>
        <input type="password" name="password" placeholder="Password">
        <br><br>

        <label>Language</label>
        <br><br>

        <input type="radio" name="language" value="HTML"> HTML <br>
        <input type="radio" name="language" value="CSS"> CSS <br>
        <input type="radio" name="language" value="JavaScript"> JS
        <br><br><br>

        <label>Course</label>
        <br><br>

        <input type="checkbox" name="course" value="Java Stack"> Java Stack <br>
        <input type="checkbox" name="course" value="Data Science"> Data Science <br>
        <input type="checkbox" name="course" value="MERN Stack"> Mern Stack
        <br><br><br>

        <label>Field:</label>
        <br><br>

        <select name="field">
            <option selected disabled>Select</option>
            <option>Frontend</option>
            <option>Backend</option>
            <option>Full Stack</option>
            <option>Data Science</option>
        </select>

        <br><br>

        <textarea rows="3" cols="25" placeholder="Describe yourself"></textarea>

        <br><br>

        <label>Date</label>
        <br><br>

        <input type="date" name="date">

        <br><br>

        <label>Phone No.</label>
        <input type="tel" name="phone" placeholder="Phone NO.">

        <br><br>

        <input type="submit" value="submit">

    </form>

    <br>

    <a href="table.html">Click Here For Table File</a>

</body>

</html>
